group = "com.mustafa707.unlock_detector"
version = "1.4.0"

// No buildscript block and no Kotlin Gradle Plugin.
//
// Kotlin comes from AGP's built-in support (AGP 9+), and the Android Gradle
// Plugin itself is supplied by the consuming app's build. Declaring either one
// here would put this plugin's chosen version on the app's build classpath and
// silently force it on every other module.
apply plugin: "com.android.library"

android {
    namespace = "com.mustafa707.unlock_detector"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}
