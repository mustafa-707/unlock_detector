name: unlock_detector
description: "A Flutter plugin to detect device lock/unlock and app foreground/background events for user online/offline presence."
version: 1.3.0
repository: https://github.com/mustafa-707/unlock_detector
issue_tracker: https://github.com/mustafa-707/unlock_detector/issues

topics:
  - lock
  - unlock
  - lifecycle
  - presence
  - foreground

environment:
  # AppLifecycleListener and AppLifecycleState.hidden landed in Flutter 3.13
  # (Dart 3.1); the plugin does not compile on anything older.
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.mustafa707.unlock_detector
        pluginClass: UnlockDetectorPlugin
      ios:
        pluginClass: UnlockDetectorPlugin
      web:
        pluginClass: UnlockDetectorWeb
        fileName: unlock_detector_web.dart
      macos:
        pluginClass: UnlockDetectorPlugin
      windows:
        pluginClass: UnlockDetectorPluginCApi
      linux:
        pluginClass: UnlockDetectorPlugin
